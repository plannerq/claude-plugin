name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code (for its plugin validator only; no login needed)
        run: npm install -g @anthropic-ai/claude-code
      - name: Check the plugin
        run: scripts/check.sh
